<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="165" viewBox="0 0 1200 165" role="img" aria-labelledby="title desc">
<title id="title">Contact Ali Nasser Al-Ojeely</title>
<desc id="desc">Invitation to connect by email</desc>
