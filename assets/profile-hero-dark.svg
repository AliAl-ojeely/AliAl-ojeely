<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="403" viewBox="0 0 1280 403" role="img" aria-labelledby="title desc">
<title id="title">Ali Nasser Al-Ojeely | Software Developer (dark)</title>
<desc id="desc">Personal developer banner highlighting desktop, web, game tools and localization.</desc>
<defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#080d19"/><stop offset="1" stop-color="#10182d"/></linearGradient>
    <linearGradient id="glow" x1="0" x2="1"><stop offset="0" stop-color="#6cecf0"/><stop offset="1" stop-color="#a695ff"/></linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#151f35"/><stop offset="1" stop-color="#1d2a43"/></linearGradient>
    <radialGradient id="orb"><stop offset="0" stop-color="#5ad5ef" stop-opacity=".24"/><stop offset="1" stop-color="#5ad5ef" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7896b5" stroke-width=".75" stroke-opacity=".12"/></pattern>
    <clipPath id="clip"><rect width="1280" height="403" rx="28"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#020613" flood-opacity=".34"/></filter>
    </defs>
    <g clip-path="url(#clip)">
    <rect width="1280" height="403" fill="url(#bg)"/>
    <rect width="1280" height="403" fill="url(#grid)"/>
    <circle cx="1120" cy="36" r="330" fill="url(#orb)"/>
    <circle cx="860" cy="490" r="250" fill="#8661c9" opacity=".08"/>
    <path d="M38 365H1242" stroke="#3f5777" stroke-opacity=".4"/>
    <rect x="48" y="43" width="67" height="54" rx="13" fill="#1d2a43" stroke="#63d9e6" stroke-width="1.3"/>
    <text x="81" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="900" fill="#f0f7ff">AO<tspan fill="#52e3e7">.</tspan></text>
    <text x="137" y="65" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#9cacc8">SOFTWARE DEVELOPER</text>
    <text x="137" y="85" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="1" fill="#56c6d8">DESKTOP  /  WEB  /  GAME TOOLS</text>
    <text x="48" y="186" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="800" letter-spacing="-2" fill="#f0f7ff">Ali Nasser</text>
    <text x="48" y="259" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="800" letter-spacing="-2" fill="#f0f7ff">Al-Ojeely<tspan fill="#62dfe4">.</tspan></text>
    <text x="50" y="303" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#9cacc8">Crafting useful software at the intersection of</text>
    <text x="50" y="331" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#9cacc8">interface design, systems, and game technology.</text>
    <g font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1">
    <circle cx="51" cy="383" r="4" fill="#54dfbf"/><text x="63" y="387" fill="#9cacc8">OFFLINE-FIRST</text>
    <circle cx="218" cy="383" r="4" fill="#a898ff"/><text x="230" y="387" fill="#9cacc8">ARABIC / ENGLISH</text>
    <circle cx="414" cy="383" r="4" fill="#68ddea"/><text x="426" y="387" fill="#9cacc8">BUILT WITH CARE</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="816" y="60" width="413" height="279" rx="18" fill="url(#glass)" stroke="#3f5777" stroke-width="1.5"/>
      <path d="M816 108H1229" stroke="#3f5777" stroke-opacity=".7"/>
      <circle cx="839" cy="84" r="5" fill="#fa7d96"/><circle cx="857" cy="84" r="5" fill="#f6c976"/><circle cx="875" cy="84" r="5" fill="#63dbc2"/>
      <text x="1017" y="89" text-anchor="middle" font-size="14" font-family="Consolas,'Courier New',monospace" fill="#9cacc8">workspace / overview</text>
      <rect x="835" y="127" width="150" height="84" rx="10" fill="#1d2a43" stroke="#3f5777" stroke-opacity=".7"/>
