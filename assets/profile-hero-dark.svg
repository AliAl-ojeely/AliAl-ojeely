      <path d="M858 165L879 148L898 159L923 143L943 155L960 143" stroke="#61e2e7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="849" y="195" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#9cacc8">NEXUS / DESKTOP</text>
      <rect x="998" y="127" width="212" height="84" rx="10" fill="#1d2a43" stroke="#3f5777" stroke-opacity=".7"/>
      <text x="1013" y="149" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#9cacc8">WEB / EMULATION</text>
      <rect x="1013" y="162" width="35" height="32" rx="6" fill="#4e3b7c"/><rect x="1056" y="162" width="35" height="32" rx="6" fill="#376c8f"/><rect x="1099" y="162" width="35" height="32" rx="6" fill="#286e75"/><rect x="1142" y="162" width="53" height="32" rx="6" fill="#443864"/>
      <text x="1170" y="184" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="16" font-weight="700" fill="#e9dfff">WASM</text>
      <rect x="835" y="222" width="375" height="98" rx="10" fill="#1d2a43" stroke="#3f5777" stroke-opacity=".7"/>
      <text x="850" y="244" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#9cacc8">LOCALIZATION PIPELINE</text>
      <rect x="850" y="261" width="103" height="41" rx="6" fill="#151f35" stroke="#3f5777"/>
      <text x="901" y="288" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="20" font-weight="700" fill="#88dfea">EN</text>
      <path d="M973 282H1053" stroke="#90e2e6" stroke-width="2.5" stroke-linecap="round"/><path d="M1043 273L1053 282L1043 291" fill="none" stroke="#90e2e6" stroke-width="2.5"/>
      <rect x="1071" y="261" width="124" height="41" rx="6" fill="#151f35" stroke="#9675d4"/>
      <text x="1133" y="288" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="20" font-weight="700" fill="#bdabff">AR / RTL</text>
    </g>
    <path d="M795 177L779 188V267L795 281" fill="none" stroke="#58d9e6" opacity=".5" stroke-width="2"/>
    <circle cx="793" cy="177" r="4" fill="#60e3ee"/><circle cx="793" cy="281" r="4" fill="#a89dff"/>
    <path d="M0 400H1280" stroke="url(#glow)" stroke-width="5"/>
